[project]
name = "oncall-agent"
version = "0.1.0"
description = "RAG assistant that answers oncall questions from wiki articles"
requires-python = ">=3.9"
dependencies = [
    "chainlit>=1.1",
    "anthropic>=0.34",
    "openai>=1.40",
    "chromadb>=0.5",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
